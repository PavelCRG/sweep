[package]
name = "sweep"
version = "0.1.2"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
jwalk = "0.8"
ratatui = "0.30.2"
crossterm = "0.29"
trash = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
unicode-width = "0.1"
fs2 = "0.4"
sysinfo = { version = "0.30.13", default-features = false }
ctrlc = "3.5.2"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
semver = "1"

[profile.release]
lto = true
strip = true
opt-level = 3
